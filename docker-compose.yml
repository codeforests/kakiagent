# Local stack (plan §7 "Local environment"). Versions pinned to what AWS runs:
# Postgres 16 + pgvector (Aurora PostgreSQL 16, ADR-004), Valkey 8 (ElastiCache Valkey),
# LocalStack for SQS and S3. Data lives in named volumes and survives down/up.
#   up:    pnpm stack:up      down: pnpm stack:down      reset: pnpm stack:reset
# Credentials come from the root .env (generated by scripts/gen-local-env.mjs).
name: kakiagent

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kakiagent
      POSTGRES_USER: kaki_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run node scripts/gen-local-env.mjs first}
    ports: ['${POSTGRES_PORT:-5432}:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kaki_owner -d kakiagent']
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:8
    ports: ['${VALKEY_PORT:-6379}:6379']
    volumes: ['valkey-data:/data']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: sqs,s3
      AWS_DEFAULT_REGION: ap-southeast-1
    ports: ['${LOCALSTACK_PORT:-4566}:4566']
    volumes:
      - ./infra/local/localstack:/etc/localstack/init/ready.d:ro
      - localstack-data:/var/lib/localstack
    healthcheck:
      # Ready once the init scripts have created the queues and the buckets.
      test:
        [
          'CMD-SHELL',
          'awslocal sqs get-queue-url --queue-name ingest.fifo >/dev/null 2>&1 && awslocal s3api head-bucket --bucket kaki-local-audit-anchors >/dev/null 2>&1 && awslocal s3api head-bucket --bucket kaki-local-sources >/dev/null 2>&1',
        ]
      interval: 3s
      timeout: 5s
      retries: 40

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['${MAILPIT_SMTP_PORT:-1025}:1025', '${MAILPIT_UI_PORT:-8025}:8025']

  # ClamAV stands in for GuardDuty Malware Protection locally (plan §7, R7): the ingest
  # worker scans every upload with it (FEAT-015 §5.3). The image carries its signatures;
  # loading them takes a minute on first start.
  clamav:
    image: clamav/clamav:1.4
    ports: ['${CLAMAV_PORT:-3310}:3310']
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 5s
      timeout: 10s
      retries: 6
      start_period: 180s

volumes:
  postgres-data:
  valkey-data:
  localstack-data:
