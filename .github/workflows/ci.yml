# CI (plan §7 engineering foundations, ADR-022). Run by hand, not on every push or PR,
# to stay inside the monthly Actions minutes (owner, 2026-10-24): once every three
# features, at each milestone close, and when a feature touches the widget, infra, CI
# or dependencies (docs/build/STATE.md, "CI cadence"). Start it from the Actions tab
# (Run workflow, pick the PR's branch) or `gh workflow run ci.yml --ref <branch>`.
# CD to the launch environment is added at MD (ADR-023); the dev → staging → prod
# promotion returns at the prod trigger.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  static:
    name: Format, lint, boundaries, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint # includes the dependency-cruiser module boundaries
      - run: pnpm typecheck

  unit:
    name: Unit tests and design-token contrast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test # design-tokens' tests fail on any pair below WCAG AA

  integration:
    name: Integration tests (Testcontainers) and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The ingest worker's crawler tests drive Chromium (FEAT-012 D3).
      - run: pnpm --filter @kaki/ingest-worker exec playwright-core install --with-deps --only-shell chromium
      # Its file tests run Tesseract (English and simplified Chinese) and pdftoppm (FEAT-015).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-chi-sim poppler-utils
      # Unit and integration projects together, with each package's coverage
      # thresholds (plan §7). Includes the cross-tenant RLS suite (GOV-03).
      - run: pnpm test:coverage --concurrency=2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: '**/coverage/coverage-summary.json'
          if-no-files-found: ignore

  build:
    name: Build and widget size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm size # ADR-016 loader ≤ 14 KB gz, NFR-02 initial load ≤ 30 KB gz
      - name: No dev sign-in in a bundle (plan §2; removed by FEAT-005)
        run: |
          if grep -rqE "dev/sign-in|kaki_dev_session" apps/api/dist/main.js apps/realtime/dist/main.js apps/dashboard/dist/assets; then
            echo "::error::A dev sign-in is in a production bundle"
            exit 1
          fi

  e2e:
    name: Skeleton E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: node scripts/gen-local-env.mjs
      - run: docker compose up -d --wait
      - run: pnpm db:setup
      # Chromium too in every job: the ingest worker crawls with it (FEAT-012).
      - run: pnpm --filter @kaki/e2e exec playwright install --with-deps ${{ matrix.browser }} chromium
      # `pnpm dev` runs the ingest worker, which reads files with Tesseract and pdftoppm (FEAT-015).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-chi-sim poppler-utils
      - run: pnpm test:e2e --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            e2e/playwright-report
            e2e/test-results
      - if: always()
        run: docker compose down -v

  eval:
    name: AI eval (fast subset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Fake provider until M1.5: recorded outputs through the agent pipeline (AGT-14, ADR-022).
      - run: pnpm eval --fast

  security:
    name: Dependency and container scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm audit --prod --audit-level=high
      - name: Trivy (dependencies, secrets, IaC)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          # Dependencies are scanned through pnpm-lock.yaml; files shipped inside
          # packages (their own CI Dockerfiles) are not ours to fix.
          skip-dirs: '**/node_modules'
          # Deliberate exceptions, each with its reason.
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - run: docker build --build-arg ROLE=api -t kaki/api:ci .
      # The ingest-worker image carries Tesseract with both languages and pdftoppm (FEAT-015 §5.8).
      - run: docker build --build-arg ROLE=ingest-worker -t kaki/ingest-worker:ci .
      - name: OCR tools in the ingest-worker image
        run: |
          langs=$(docker run --rm kaki/ingest-worker:ci tesseract --list-langs)
          echo "$langs"
          for l in eng chi_sim; do grep -qx "$l" <<<"$langs" || { echo "::error::tesseract lacks $l"; exit 1; }; done
          docker run --rm kaki/ingest-worker:ci pdftoppm -v
      - name: Trivy (api image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: kaki/api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  terraform:
    name: Terraform validate, test and tflint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - run: terraform fmt -recursive -check
      - run: terraform init -backend=false -input=false
        working-directory: infra/terraform/envs/prod
      - run: terraform validate
        working-directory: infra/terraform/envs/prod
      # Plans the launch and full profiles on mocked providers (ADR-023, ADR-024).
      - run: terraform test
        working-directory: infra/terraform/envs/prod
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --config "$PWD/.tflint.hcl"

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
