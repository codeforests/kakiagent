<!doctype html>
<!-- FEAT-032 fixture: Shopify-like. Light; brand from meta theme-color #008060; Assistant;
     button radius 8px. The add-to-cart buttons are a different colour on purpose. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#008060" />
    <title>Kopi Lab (Shopify fixture)</title>
    <style>
      :root {
        --color-button: 51, 51, 51;
      }
      body {
        margin: 0;
        background: #ffffff;
        color: #121212;
        font-family: Assistant, sans-serif;
      }
      .page-width {
        padding: 24px;
      }
      .button {
        background-color: rgb(var(--color-button));
        color: #fff;
        border-radius: 8px;
        padding: 12px 24px;
        border: 0;
      }
      .shopify-payment-button__button {
        background: #5a31f4;
        color: #fff;
        border-radius: 8px;
      }
    </style>
  </head>
  <body class="template-product">
    <div class="page-width">
      <h1 class="product__title">House blend, 250 g</h1>
      <button class="button product-form__submit" type="submit">Add to cart</button>
      <button class="shopify-payment-button__button" type="button">Buy it now</button>
    </div>
    <script
      async
      src="/w/v1/loader.js"
      data-key="%WIDGET_KEY%"
      data-api="%WIDGET_API_URL%"
    ></script>
  </body>
</html>
